<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | MyApp</title>

    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    />
  </head>

  <body>
    <main class="form-container">
      <form action="#" method="post">
        <section class="form-left">
          <h3>MyApp</h3>
          -=

          <h2>Welcome Back!</h2>
          <p>Login to your account and continue your journey.</p>

          <img src="./assets/images/login.png" alt="Login illustration" />
        </section>

        <section class="form-right">
          <h1 class="login">Login</h1>

          <p class="dis-text">
            Enter your email and password to access your account
          </p>

          <div class="input">
            <div>
              <i class="fa-regular fa-envelope icon" aria-hidden="true"></i>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email address"
                autocomplete="email"
                aria-label="Email address"
                required
              />
            </div>

            <div>
              <i class="fa-solid fa-lock icon" aria-hidden="true"></i>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                minlength="8"
                aria-label="Password"
                required
              />

              <i
                class="fa-regular fa-eye-slash icon icon-eye"
                aria-hidden="true"
              ></i>
            </div>
          </div>

          <div class="wrap">
            <label for="remember">
              <input type="checkbox" id="remember" name="remember" />
              Remember me
            </label>

            <a href="#">Forgot password?</a>
          </div>

          <div class="buttons">
            <button type="submit" class="login-btn">Login</button>

            <div class="line">
              <span>OR</span>
            </div>

            <button type="button" class="google-btn">
              <i class="fa-brands fa-google" aria-hidden="true"></i>
              Continue with Google
            </button>
          </div>

          <p class="reg">
            Don't have an account?
            <a href="./register.html">Register</a>
          </p>
        </section>
      </form>
    </main>
  </body>
</html>
