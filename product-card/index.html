<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product-Card</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="product-container">
        <div class="product-card">
            <div class="new-hart">
                <p class="new">New</p>
                <button class="wish">♡</button>
            </div>
            <span class="product-bg"></span>
            <img class="product-img" src="/assets/images/product.png" alt="Nike Green running shoes green color">
            <h3 class="product-name">Nike Green</h3>
            <small class="product-cgy">Running shoes</small>

            <p class="rating"><span>⭐4.5 </span>&lpar; 2.4k reviews &rpar;</p>

            <h2 class="product-price">$129.99  <span><del> $149.99</del></span></h2>

            <button class="btn-cart">&#128722; Add to Cart</button>
        </div>
    </div>
</body>
</html>
