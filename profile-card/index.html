<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile-Card</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="profile-card-container">
      <div class="profile-card">
        <div class="profile-bg">
          <img src="/assets/images/profile-bg.png" alt="profile-bg"  />
        </div>
        <div class="profile-image">
          <img src="/assets/images/profile.png" alt="profile-pic" />
        </div>
        <div class="profile-info">
          <h2 class="name">Saradhi</h2>
          <h4 class="role">Frontend Developer</h4>
          <p class="description">
            passionate about building beautiful and responsive web applications.
            Always eager to learn new technologies and improve my skills.
          </p>
          <p class="location">
            <i class="fa-solid fa-location-dot"></i>
            Chittoor,India
          </p>
        </div>
        <div class="btn">
            <button  class="btn1"><i class="fa-solid fa-user-plus"></i>Follow</button>
            <button class="btn2"><i class="fa-regular fa-comment-dots"></i>Message</button>
        </div>
        <br>
        <hr >
        <div class="social-media">
          <a href="#"><i class="fa-brands fa-github"></i></a>
          <a href="#"><i class="fa-brands fa-linkedin"></i></a>
          <a href="#"><i class="fa-brands fa-instagram"></i></a>
          <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
        </div>
      </div>
    </div>
  </body>
</html>
